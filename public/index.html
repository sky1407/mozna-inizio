<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Google SERP export</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Google SERP export</h1>
      <p class="lead">Zadajte kľúčové slovo a stiahnite si organické výsledky z 1. strany Google ako JSON alebo CSV.</p>

      <form id="search-form" role="search">
        <label for="q" class="visually-hidden">Kľúčové slovo</label>
        <input id="q" name="q" type="search" placeholder="napr. tvorba webových stránek" maxlength="200" required autofocus />
        <button type="submit">Hľadať</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>

      <section id="output" hidden>
        <div class="downloads">
          <a id="download-json" class="button" download>Stiahnuť JSON</a>
          <a id="download-csv" class="button" download>Stiahnuť CSV</a>
        </div>
        <ol id="results"></ol>
      </section>
    </main>
  </body>
</html>
